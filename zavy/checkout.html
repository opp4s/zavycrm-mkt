<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - ZavyCRM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 px-6 shadow-lg">
        <div class="max-w-6xl mx-auto">
            <h1 class="text-xl font-bold">ZavyCRM - Checkout</h1>
        </div>
    </header>

    <main class="max-w-6xl mx-auto py-8 px-6">
        <!-- Billing Toggle -->
        <div class="flex justify-center mb-8">
            <div class="bg-white rounded-full p-1 shadow inline-flex">
                <button id="monthly-btn" onclick="setBilling('monthly')" class="px-6 py-2 rounded-full text-sm font-semibold bg-gradient-to-r from-purple-600 to-indigo-600 text-white">
                    Mensal
                </button>
                <button id="annual-btn" onclick="setBilling('annual')" class="px-6 py-2 rounded-full text-sm font-semibold text-gray-600">
                    Anual <span class="text-green-500 text-xs">-20%</span>
                </button>
            </div>
        </div>

        <!-- Plans -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12" id="plans-container">
            <!-- Plans populated by JS -->
        </div>

        <!-- Addons -->
        <div class="mb-12">
            <h2 class="text-2xl font-bold text-center mb-6">Personalize seu plano</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="addons-container">
                <!-- Addons populated by JS -->
            </div>
        </div>

        <!-- Summary -->
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div>
                    <h3 class="text-xl font-bold mb-4">Resumo do pedido</h3>
                    <div id="summary-content">
                        <!-- Summary populated by JS -->
                    </div>
                </div>
                <div>
                    <h3 class="text-xl font-bold mb-4">Seus dados</h3>
                    <form id="checkout-form" class="space-y-4">
                        <input type="text" name="name" placeholder="Nome completo" required class="w-full px-4 py-2 border rounded-lg">
                        <input type="email" name="email" placeholder="E-mail" required class="w-full px-4 py-2 border rounded-lg">
                        <input type="tel" name="phone" placeholder="Telefone" required class="w-full px-4 py-2 border rounded-lg">
                        <input type="text" name="document" placeholder="CPF/CNPJ" required class="w-full px-4 py-2 border rounded-lg">
                        <button type="submit" class="w-full bg-gradient-to-r from-purple-600 to-indigo-600 text-white py-4 rounded-lg font-bold text-lg">
                            Finalizar compra
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE = 'https://back.zavycrm.com/webhook';
        
        let billingCycle = 'monthly';
        let selectedPlan = 'Smart';
        let selectedAddons = {};

        const plans = {
            Solo: { monthly: 69, annual: 55, features: ['1 usuário', '1 WhatsApp', '500 disparos/mês', '500 contatos', '1 agente IA', '500 créditos IA'] },
            Smart: { monthly: 99, annual: 79, features: ['1 usuário', '1 WhatsApp', 'Disparos ilimitados', '1.000 contatos', '5 agentes IA', '1.000 créditos IA', '2 quadros CRM'] },
            Business: { monthly: 129, annual: 103, features: ['3 usuários', '3 WhatsApp', 'Disparos ilimitados', '5.000 contatos', '10 agentes IA', '2.500 créditos IA', 'CRM ilimitado', 'API e Webhooks'] },
            Growth: { monthly: 249, annual: 199, features: ['8 usuários', '6 WhatsApp', 'Disparos ilimitados', '10.000 contatos', '50 agentes IA', '10.000 créditos IA', 'CRM ilimitado', 'API e Webhooks'] }
        };

        const addons = [
            { id: 'usuario_extra', name: 'Usuário Adicional', price: 29, icon: '👥', description: '+1 atendente na equipe' },
            { id: 'whatsapp_extra', name: 'WhatsApp Adicional', price: 39, icon: '📱', description: '+1 conexão WhatsApp' },
            { id: 'creditos_ia_small', name: 'Pack 2.000 Créditos IA', price: 29.90, icon: '🤖', description: '≈1.000 mensagens', credits: 2000 },
            { id: 'creditos_ia_medium', name: 'Pack 5.000 Créditos IA', price: 59.90, icon: '🤖', description: '≈2.500 mensagens', credits: 5000 },
            { id: 'creditos_ia_large', name: 'Pack 10.000 Créditos IA', price: 99.90, icon: '🤖', description: '≈5.000 mensagens', credits: 10000 },
            { id: 'contatos_5k', name: '+5.000 Contatos', price: 29, icon: '👤', description: 'Amplie sua base' },
            { id: 'contatos_10k', name: '+10.000 Contatos', price: 49, icon: '👤', description: 'Amplie sua base' },
            { id: 'contatos_25k', name: '+25.000 Contatos', price: 99, icon: '👤', description: 'Amplie sua base' }
        ];

        function init() {
            renderPlans();
            renderAddons();
            updateSummary();
        }

        function setBilling(cycle) {
            billingCycle = cycle;
            document.getElementById('monthly-btn').className = cycle === 'monthly' 
                ? 'px-6 py-2 rounded-full text-sm font-semibold bg-gradient-to-r from-purple-600 to-indigo-600 text-white'
                : 'px-6 py-2 rounded-full text-sm font-semibold text-gray-600';
            document.getElementById('annual-btn').className = cycle === 'annual'
                ? 'px-6 py-2 rounded-full text-sm font-semibold bg-gradient-to-r from-purple-600 to-indigo-600 text-white'
                : 'px-6 py-2 rounded-full text-sm font-semibold text-gray-600';
            renderPlans();
            updateSummary();
        }

        function renderPlans() {
            const container = document.getElementById('plans-container');
            container.innerHTML = Object.entries(plans).map(([name, plan]) => `
                <div class="bg-white rounded-xl shadow-lg p-6 cursor-pointer transition-all hover:-translate-y-1 ${selectedPlan === name ? 'ring-2 ring-purple-500' : ''}" onclick="selectPlan('${name}')">
                    <div class="text-center mb-4">
                        <h3 class="text-2xl font-bold">${name}</h3>
                        <p class="text-4xl font-bold text-purple-600 mt-2">R$ ${billingCycle === 'monthly' ? plan.monthly : plan.annual}</p>
                        <p class="text-gray-500 text-sm">/mês</p>
                    </div>
                    <ul class="space-y-2 text-sm">
                        ${plan.features.map(f => `<li class="flex items-center gap-2"><span class="text-green-500">✓</span> ${f}</li>`).join('')}
                    </ul>
                </div>
            `).join('');
        }

        function renderAddons() {
            const container = document.getElementById('addons-container');
            container.innerHTML = addons.map(addon => `
                <div class="bg-white rounded-xl shadow-lg p-6 cursor-pointer transition-all hover:-translate-y-1 ${selectedAddons[addon.id] ? 'ring-2 ring-purple-500 bg-purple-50' : ''}" onclick="toggleAddon('${addon.id}')">
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-2xl">${addon.icon}</span>
                        <h4 class="font-bold">${addon.name}</h4>
                    </div>
                    <p class="text-gray-500 text-sm mb-2">${addon.description}</p>
                    <p class="text-xl font-bold text-purple-600">+R$ ${addon.price.toFixed(2).replace('.', ',')}/mês</p>
                </div>
            `).join('');
        }

        function selectPlan(name) {
            selectedPlan = name;
            renderPlans();
            updateSummary();
        }

        function toggleAddon(id) {
            if (selectedAddons[id]) {
                delete selectedAddons[id];
            } else {
                selectedAddons[id] = true;
            }
            renderAddons();
            updateSummary();
        }

        function updateSummary() {
            const plan = plans[selectedPlan];
            const planPrice = billingCycle === 'monthly' ? plan.monthly : plan.annual;
            
            let addonsHtml = '';
            let addonsTotal = 0;
            
            Object.keys(selectedAddons).forEach(id => {
                const addon = addons.find(a => a.id === id);
                if (addon) {
                    addonsTotal += addon.price;
                    addonsHtml += `
                        <div class="flex justify-between py-2 border-b">
                            <span>${addon.name}</span>
                            <span class="font-semibold">+R$ ${addon.price.toFixed(2).replace('.', ',')}</span>
                        </div>
                    `;
                }
            });

            const total = planPrice + addonsTotal;

            document.getElementById('summary-content').innerHTML = `
                <div class="flex justify-between py-2 border-b">
                    <span class="font-semibold">Plano ${selectedPlan}</span>
                    <span class="font-bold">R$ ${planPrice},00</span>
                </div>
                ${addonsHtml}
                <div class="flex justify-between py-4 border-t-2 border-purple-500 mt-4">
                    <span class="text-lg font-bold">Total mensal</span>
                    <span class="text-2xl font-bold text-purple-600">R$ ${total.toFixed(2).replace('.', ',')}</span>
                </div>
                ${billingCycle === 'annual' ? `
                    <div class="bg-green-50 rounded-lg p-3 mt-4">
                        <span class="text-green-700 font-semibold">✓ Economia de 20% no plano anual!</span>
                    </div>
                ` : ''}
            `;
        }

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const data = {
                plan: selectedPlan,
                billing_cycle: billingCycle,
                addons: Object.keys(selectedAddons),
                customer: {
                    name: formData.get('name'),
                    email: formData.get('email'),
                    phone: formData.get('phone'),
                    document: formData.get('document')
                }
            };

            try {
                const response = await fetch(`${API_BASE}/create-checkout`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                
                if (result.checkout_url) {
                    window.location.href = result.checkout_url;
                } else {
                    alert('Erro ao processar pagamento');
                }
            } catch (error) {
                alert('Erro ao processar solicitação');
            }
        });

        init();
    </script>
</body>
</html>
